{% extends "admin/change_form.html" %}
{% load static %}

{% block submit_buttons_bottom %}
    {{ block.super }}
    
    {% if show_bulk_upload and original %}
    <div style="margin-top: 20px; padding: 20px; background: #f0f9ff; border: 2px solid #3b82f6; border-radius: 8px;">
        <h3 style="margin-top: 0; color: #1e40af; display: flex; align-items: center; gap: 10px;">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            Bulk Photo Upload
        </h3>
        <p style="color: #475569; margin: 10px 0;">
            Upload multiple photos at once with drag & drop interface
        </p>
        <a href="{% url 'admin:gallery_bulk_upload' gallery_id %}" 
           class="button" 
           style="display: inline-flex; align-items: center; gap: 8px; background: #3b82f6; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600;">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            Upload Multiple Photos
        </a>
    </div>
    {% endif %}
{% endblock %}
