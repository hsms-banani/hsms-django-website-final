
{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
<div id="content-main">
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div>
            <label for="csv_file">{% trans 'Please select a CSV file to upload' %}</label>
            <input type="file" name="csv_file" id="csv_file" accept=".csv">
        </div>
        <div class="submit-row">
            <input type="submit" value="{% trans 'Upload' %}" class="default">
        </div>
    </form>
    {% include "admin/library/book/import_instructions.html" %}

    {% if import_log %}
    <div style="margin-top: 30px; background: #fff; padding: 20px; border: 1px solid #ddd;">
        <h2>Import Log</h2>
        <pre style="background: #f8f8f8; padding: 15px; border: 1px solid #eee; overflow: auto; max-height: 500px; white-space: pre-wrap; font-family: monospace;">{{ import_log }}</pre>
    </div>
    {% endif %}
</div>
{% endblock %}
