{# templates/library/partials/generic_load_more.html #}
{# This block will be appended to the existing book grid #}
{% for book in page_obj %}
    {% include "library/partials/book_card.html" %}
{% endfor %}

{# This block will replace the pagination container #}
<div id="pagination-container" hx-swap-oob="true">
    {% if page_obj.has_next %}
    <div class="text-center mt-8">
        <button hx-get="{{ request.path }}?page={{ page_obj.next_page_number }}" 
                hx-target=".book-grid" 
                hx-swap="beforeend" 
                class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 ease-in-out">
            <span class="htmx-indicator">
                <i class="fas fa-spinner fa-spin mr-2"></i>Loading...
            </span>
            <span class="htmx-no-indicator">
                Load More Books
            </span>
        </button>
    </div>
    {% endif %}
</div>
