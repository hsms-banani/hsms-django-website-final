
{% extends 'base.html' %}
{% load static %}

{% block title %}Our Students{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8" x-data="studentList()">
    <div class="bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="px-6 py-4 border-b">
            <h1 class="text-3xl font-bold font-serif text-gray-800">Our Students</h1>
        </div>

        <!-- Filters and Controls -->
        <div class="px-6 py-4 bg-gray-50">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Status Filter -->
                <div>
                    <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
                    <select id="status" x-model="status" @change="fetchStudents" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                        <option value="active">Active</option>
                        <option value="graduated">Graduated</option>
                        <option value="all">All</option>
                    </select>
                </div>
                <!-- Student Type Filter -->
                <div>
                    <label for="student_type" class="block text-sm font-medium text-gray-700">Student Type</label>
                    <select id="student_type" x-model="student_type" @change="fetchStudents" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                        <option value="">All</option>
                        <option value="diocesan">Diocesan</option>
                        <option value="congregation">Congregation</option>
                    </select>
                </div>
                <!-- Affiliation Filter -->
                <div>
                    <label for="affiliation" class="block text-sm font-medium text-gray-700">Diocese/Congregation</label>
                    <input type="text" id="affiliation" x-model="affiliation" @input.debounce.300ms="fetchStudents" placeholder="Filter by diocese or congregation" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <!-- Year Joined Filter -->
                <div>
                    <label for="year_joined" class="block text-sm font-medium text-gray-700">Year Joined</label>
                    <input type="number" id="year_joined" x-model="year_joined" @input.debounce.300ms="fetchStudents" placeholder="Filter by year" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <!-- Name of Study Filter -->
                <div>
                    <label for="name_of_study" class="block text-sm font-medium text-gray-700">Name of Study</label>
                    <input type="text" id="name_of_study" x-model="name_of_study" @input.debounce.300ms="fetchStudents" placeholder="Filter by study name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <!-- Year Completed Filter -->
                <div>
                    <label for="year_completed" class="block text-sm font-medium text-gray-700">Year Completed</label>
                    <input type="number" id="year_completed" x-model="year_completed" @input.debounce.300ms="fetchStudents" placeholder="Filter by year" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>
        </div>

        <!-- Student List -->
        <div class="px-6 py-4">
            <template x-if="loading">
                <div class="text-center py-8">
                    <i class="fas fa-spinner fa-spin text-4xl text-gray-500"></i>
                    <p class="mt-2 text-gray-600">Loading students...</p>
                </div>
            </template>

            <template x-if="!loading && students.length === 0">
                <div class="text-center py-8">
                    <i class="fas fa-exclamation-circle text-4xl text-gray-400"></i>
                    <p class="mt-2 text-gray-600">No students found matching your criteria.</p>
                </div>
            </template>

            <template x-if="!loading && students.length > 0">
            <template x-if="!loading && students.length > 0">
                <div class="overflow-x-auto bg-white rounded-lg shadow-sm">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Photo
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Name
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Name of Study
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Year Joined
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Year Completed
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Diocese/Congregation
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Status
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <template x-for="student in students" :key="student.id">
                                <tr class="hover:bg-gray-50">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <img loading="lazy" x-show="student.photo_url" :src="student.photo_url" alt="Student Photo" class="h-10 w-10 rounded-full object-cover">
                                        <div x-show="!student.photo_url" class="h-10 w-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 text-sm">
                                            <i class="fas fa-user"></i>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" x-text="student.name"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="student.name_of_study"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="student.year_joined"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="student.year_completed"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="student.student_type === 'diocesan' ? student.diocese : student.congregation"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                            :class="{
                                                'bg-green-100 text-green-800': student.status === 'active',
                                                'bg-blue-100 text-blue-800': student.status === 'graduated',
                                                'bg-gray-100 text-gray-800': student.status !== 'active' && student.status !== 'graduated'
                                            }"
                                            x-text="student.status.charAt(0).toUpperCase() + student.status.slice(1)"
                                        ></span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            </template>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function studentList() {
        return {
            students: [],
            loading: true,
            status: 'active',
            student_type: '',
            affiliation: '',
            year_joined: '',
            name_of_study: '',
            year_completed: '',

            init() {
                this.fetchStudents();
            },

            fetchStudents() {
                this.loading = true;
                const params = new URLSearchParams({
                    status: this.status,
                    student_type: this.student_type,
                    affiliation: this.affiliation,
                    year_joined: this.year_joined,
                    name_of_study: this.name_of_study,
                    year_completed: this.year_completed
                });
                
                fetch(`/api/students/list/?${params}`)
                    .then(response => response.json())
                    .then(data => {
                        this.students = data;
                        this.loading = false;
                    })
                    .catch(error => {
                        console.error('Error fetching students:', error);
                        this.loading = false;
                    });
            }
        }
    }
</script>
{% endblock %}
