<!-- library/templates/library/dashboard_return_book_confirm.html -->
<div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md mx-auto">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800">Confirm Return</h2>
        <button onclick="document.getElementById('modal-container').classList.add('hidden')" class="text-gray-500 hover:text-gray-700">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <p class="text-gray-600 mb-6">Are you sure you want to mark the publication "<strong>{{ record.publication.title }}</strong>" as returned for <strong>{{ record.borrower.get_full_name }}</strong>?</p>
    <form hx-post="{% url 'library:dashboard_return_book' record.id %}" hx-target="#tab-content" hx-swap="innerHTML">
        {% csrf_token %}
        <div class="flex justify-end">
            <button type="button" onclick="document.getElementById('modal-container').classList.add('hidden')" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400 mr-4">Cancel</button>
            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Confirm Return</button>
        </div>
    </form>
</div>
