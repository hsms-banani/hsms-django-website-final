<!-- library/templates/library/emails/borrow_confirmation.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Book Borrowed</title>
</head>
<body>
    <h2>Book Borrowed: {{ book.title }}</h2>
    <p>Dear {{ borrower.get_full_name }},</p>
    <p>You have successfully borrowed the following book:</p>
    <ul>
        <li><strong>Title:</strong> {{ book.title }}</li>
        <li><strong>Author(s):</strong> {{ book.authors_display }}</li>
        <li><strong>Due Date:</strong> {{ due_date|date:"F d, Y" }}</li>
    </ul>
    <p>Thank you for using the {{ library_name }}.</p>
</body>
</html>
